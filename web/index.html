<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Fund Company Simulator — Multi-Agent Collaborative Trading Platform" />
    <title>AI Fund Platform</title>
    <!--
      Resource hints for the Google Fonts pipeline.
      preconnect      → opens the TLS + HTTP/2 connection up-front
                        (saves ~150-300 ms TTFB on first font request).
      dns-prefetch    → fallback for HTTP/1.1 clients / older browsers
                        that ignore preconnect.
      The `crossorigin` attribute is REQUIRED on the gstatic.com hint
      because the actual font files are fetched as crossorigin
      requests; without it the browser opens a duplicate connection.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <!--
      Font roster:
        * Manrope — primary friendly grotesque used by the 2026
          cream/sage refresh (matches mockups, falls back to Inter).
        * Inter — secondary fallback for legacy pages that haven't
          adopted Manrope-specific weights yet.
        * Press Start 2P — pixel-art accent for mascot captions and
          retro chips on /style-preview. Loaded sparingly because
          the file is large; only pages that opt in via
          `font-pixel` (Tailwind utility) trigger fallback render.
        * JetBrains Mono — monospace numerics in tables / code.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <!--
      Pre-React theme bootstrap.
      Reads the persisted theme preference (web/src/lib/theme.tsx
      writes to localStorage('fundai.theme')) and applies the
      `.dark` class on <html> BEFORE React mounts. Without this
      step a user with mode='dark' sees a bright flash for ~50ms
      while the JS bundle parses, then the page snaps to dark —
      the canonical "FOIT" of dark-mode implementations. Tiny
      synchronous script + try/catch on every storage access so
      nothing here can prevent the page from loading.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("fundai.theme");
          var systemDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved =
            stored === "dark"
              ? "dark"
              : stored === "light"
                ? "light"
                : systemDark
                  ? "dark"
                  : "light";
          if (resolved === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {
          /* localStorage unavailable — fall through to default light */
        }
      })();
    </script>
  </head>
  <body class="antialiased text-ink-700 dark:bg-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <!--
      fetchpriority="high" tells the browser to bump this entry
      script to the top of its scheduling queue — the canonical
      "this is the LCP-driving resource" hint. Vite already injects
      <link rel="modulepreload"> for the chunked entry in
      production builds, so initial JS arrival lands in parallel
      with the font CSS instead of after it.
    -->
    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
  </body>
</html>
