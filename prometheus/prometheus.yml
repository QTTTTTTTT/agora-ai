# prometheus.yml — Sprint 12 reference scrape + rule + alerting config.
#
# This file is committed as an example. Production deployments
# typically version-control this in the infra repo, not in the
# application repo, but we ship a known-good example here so devs
# spinning up locally can `prometheus --config.file=prometheus.yml`
# and immediately see the dashboards and alerts described in
# docs/PROMETHEUS_QUERIES.md.

global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: fundai-server
    scrape_interval: 15s
    metrics_path: /api/metrics
    static_configs:
      - targets: [fundai-server:8080]
    relabel_configs:
      # Strip the auto-injected port from the instance label so
      # multi-replica deployments still aggregate cleanly.
      - source_labels: [__address__]
        regex: '([^:]+)(?::[0-9]+)?'
        target_label: instance
        replacement: $1
